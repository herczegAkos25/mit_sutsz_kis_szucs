<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Mit sütsz kis szűcs? 🍳</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#">Kategóriák</a>
        <a href="index.html" class="active">Mit sütsz&emsp; <br>&emsp;&emsp;&emsp; kis szűcs</a>
        <a href="#" id="openUploadBtn">Feltöltés</a>
    </nav>

    <div id="container"></div>

    <div id="uploadModal" class="modal-overlay">
        <div class="modal-window">
            <button class="modal-close-btn" onclick="closeUploadModal()">&times;</button>

            <div class="page-header">
                <h1>Új Recept Feltöltése</h1>
                <p>Oszd meg velünk a legfinomabb sütijeidet és ételeidet!</p>
            </div>

            <form id="recipeForm" onsubmit="handleFormSubmit(event)">
                
                <div class="form-section">
                    <h2 class="section-title"><i class="fa-solid fa-utensils"></i> Recept Alapadatok</h2>
                    <div class="form-grid">
                        <div class="full-width">
                            <label for="recipeTitle">Recept neve *</label>
                            <input type="text" id="recipeTitle" required placeholder="Pl. Nagymama Aranygaluskája">
                        </div>
                        
                        <div>
                            <label for="category">Kategória *</label>
                            <select id="category" required>
                                <option value="" disabled selected>Válassz kategóriát...</option>
                                <option value="Sütemény / Desszert">Sütemény / Desszert</option>
                                <option value="Főétel">Főétel</option>
                                <option value="Előétel / Leves">Előétel / Leves</option>
                                <option value="Péksütemény / Kenyér">Péksütemény / Kenyér</option>
                            </select>
                        </div>

                        <div>
                            <label for="servings">Adag (személyek száma) *</label>
                            <input type="number" id="servings" min="1" max="100" required placeholder="4">
                        </div>

                        <div>
                            <label for="prepTime">Elkészítési idő (perc) *</label>
                            <input type="number" id="prepTime" min="1" required placeholder="45">
                        </div>

                        <div>
                            <label for="difficulty">Nehézség *</label>
                            <select id="difficulty" required>
                                <option value="könnyű">Könnyű</option>
                                <option value="közepes" selected>Közepes</option>
                                <option value="nehéz">Nehéz</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Hozzávalók</h2>
                    <div id="ingredientsContainer">
                        <div class="dynamic-row">
                            <input type="text" placeholder="Mennyiség (pl. 50)" style="flex: 1;" required>
                            <input type="text" placeholder="Egység (pl. dkg, ek)" style="flex: 1;">
                            <input type="text" placeholder="Hozzávaló neve (pl. finomliszt)" style="flex: 2;" required>
                            <button type="button" class="btn btn-danger" onclick="removeRow(this)" title="Törlés"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addIngredientRow()" style="margin-top: 8px;">
                        <i class="fa-solid fa-plus"></i> Új hozzávaló
                    </button>
                </div>

                <div class="form-section">
                    <h2 class="section-title"><i class="fa-solid fa-list-ol"></i> Elkészítés lépései</h2>
                    <div id="stepsContainer">
                        <div class="dynamic-row">
                            <textarea rows="2" placeholder="1. lépés leírása..." required></textarea>
                            <button type="button" class="btn btn-danger" onclick="removeStep(this)" title="Törlés"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addStepRow()" style="margin-top: 8px;">
                        <i class="fa-solid fa-plus"></i> Új lépés
                    </button>
                </div>

                <div class="form-section">
                    <h2 class="section-title"><i class="fa-solid fa-image"></i> Recept Képe</h2>
                    <div class="image-upload-box" onclick="document.getElementById('imageInput').click()">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 32px; color: var(--wheat); margin-bottom: 8px;"></i>
                        <p style="margin: 0;">Kattints ide a kép feltöltéséhez</p>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
                        <img id="imagePreview" alt="Recept előnézeti képe">
                    </div>
                </div>

                <button type="submit" class="btn btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Recept Beküldése
                </button>
            </form>
        </div>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fa-solid fa-circle-check" style="font-size: 48px; color: var(--wheat); margin-bottom: 15px;"></i>
            <h3>Sikeres Feltöltés!</h3>
            <p>A receptedet sikeresen elmentettük.</p>
            <button class="btn btn-submit" onclick="closeSuccessModal()">Rendben</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="receptFeltöltés.js"></script>
</body>
</html>
